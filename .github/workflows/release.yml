name: Signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.11.1'
      - name: Validate signing secrets and build
        env:
          TOKOPAD_KEYSTORE_BASE64: ${{ secrets.TOKOPAD_KEYSTORE_BASE64 }}
          TOKOPAD_KEYSTORE_PASSWORD: ${{ secrets.TOKOPAD_KEYSTORE_PASSWORD }}
          TOKOPAD_KEY_ALIAS: ${{ secrets.TOKOPAD_KEY_ALIAS }}
          TOKOPAD_KEY_PASSWORD: ${{ secrets.TOKOPAD_KEY_PASSWORD }}
          TOKOPAD_KEYSTORE_PATH: ${{ runner.temp }}/tokopad-release.jks
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKOPAD_KEYSTORE_BASE64" || { echo 'Missing TOKOPAD_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$TOKOPAD_KEYSTORE_PASSWORD" || { echo 'Missing TOKOPAD_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$TOKOPAD_KEY_ALIAS" || { echo 'Missing TOKOPAD_KEY_ALIAS secret'; exit 1; }
          test -n "$TOKOPAD_KEY_PASSWORD" || { echo 'Missing TOKOPAD_KEY_PASSWORD secret'; exit 1; }
          trap 'rm -f "$TOKOPAD_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$TOKOPAD_KEYSTORE_BASE64" | base64 --decode > "$TOKOPAD_KEYSTORE_PATH"
          gradle --no-daemon lintRelease testReleaseUnitTest assembleRelease bundleRelease
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tokopad-signed-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
